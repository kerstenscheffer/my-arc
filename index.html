<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon: het MA-logo. Hier stond het standaard Vite-logo, dat in het
         tabblad van iedereen die de site opende het paarse Vite-bliksemschichtje
         liet zien. De PWA-iconen (manifest) waren al goed. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Meta Pixel Code -->
    <!-- Niet in de native app: daar komt geen advertentieverkeer binnen en
         het script kost bij elke start laadtijd. -->
    <!-- Ook niet voor Kersten zelf (localhost, ingelogd op dit apparaat, of
         ooit ?intern=1): zijn testbezoeken horen niet in Meta. Zelfde regel
         als isIntern() in src/pages/challengeTracking.js. -->
    <script>
    window.__myarcIntern = (function () {
      try {
        if (/^(localhost|127\.|0\.0\.0\.0|192\.168\.|10\.)/.test(location.hostname) || /\.local$/.test(location.hostname)) return true;
        var q = new URLSearchParams(location.search).get('intern');
        if (q === '0') { localStorage.removeItem('myarc_intern'); return false; }
        if (q === '1') localStorage.setItem('myarc_intern', '1');
        if (localStorage.getItem('myarc_intern') === '1') return true;
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (/^sb-.*-auth-token$/.test(k) && localStorage.getItem(k)) { localStorage.setItem('myarc_intern', '1'); return true; }
        }
      } catch (e) {}
      return false;
    })();
    if (!window.__myarcIntern && !(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) && location.protocol !== 'capacitor:')
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    if (window.fbq) {
    fbq('init', '1651499006027796');
    fbq('track', 'PageView');
    }
    </script>
    <!-- End Meta Pixel Code -->

    <!-- iOS PWA -->

    <link rel="apple-touch-icon" href="/icons/icon-180x180.png" />

          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "vokm1bxawa");
      }
    </script>

    <title>MY ARC</title>
    
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      /* html óók zwart: iOS/WKWebView toont bij overscroll-bounce de
         canvas-achtergrond — zonder dit kan er een andere tint doorschemeren
         boven/onder de content. */
      html {
        background: #000;
      }

      body {
        margin: 0;
        background: #000;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      #root {
        width: 100%;
        min-height: 100vh;
      }
      
      /* Loading state */
      .loading-container {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #0a0a0a;
      }
      
      /* Zelfde als LaadScherm.jsx: wit rondje met het logo in het midden. */
      .loading-logo {
        position: relative;
        width: 96px;
        height: 96px;
      }
      .loading-spinner {
        position: absolute;
        inset: 0;
        border: 3px solid rgba(255, 255, 255, 0.12);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      .loading-logo img {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 84px;
        transform: translate(-50%, -50%);
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- Meta Pixel (noscript) — hoort in body, niet in head -->
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1651499006027796&ev=PageView&noscript=1"
    /></noscript>
    <div id="root">
      <div class="loading-container">
        <div class="loading-logo">
          <div class="loading-spinner"></div>
          <img src="/ma-logo-header.png" alt="MY ARC" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

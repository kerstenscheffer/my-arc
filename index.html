    <!-- Ook niet voor Kersten zelf (localhost, ingelogd op dit apparaat, of
         ooit ?intern=1): zijn testbezoeken horen niet in Meta. Zelfde regel
         als isIntern() in src/pages/challengeTracking.js. -->
    <script>
    window.__myarcIntern = (function () {
      try {
        if (/^(localhost|127\.|0\.0\.0\.0|192\.168\.|10\.)/.test(location.hostname) || /\.local$/.test(location.hostname)) return true;
        var q = new URLSearchParams(location.search).get('intern');
        if (q === '0') { localStorage.removeItem('myarc_intern'); return false; }
        if (q === '1') localStorage.setItem('myarc_intern', '1');
        if (localStorage.getItem('myarc_intern') === '1') return true;
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (/^sb-.*-auth-token$/.test(k) && localStorage.getItem(k)) { localStorage.setItem('myarc_intern', '1'); return true; }
        }
      } catch (e) {}
      return false;
    })();
    if (!window.__myarcIntern && !(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) && location.protocol !== 'capacitor:')

    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    if (window.fbq) {
    fbq('init', '1651499006027796');
    fbq('track', 'PageView');
    }
    </script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      /* html óók zwart: iOS/WKWebView toont bij overscroll-bounce de
         canvas-achtergrond — zonder dit kan er een andere tint doorschemeren
         boven/onder de content. */
      html {
        background: #000;
      }

      body {
        margin: 0;
        background: #000;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      #root {
        width: 100%;
        min-height: 100vh;
      }
      
      /* Loading state */
      /* Vast over het hele scherm (18 nov 2026): precies dezelfde plek als
         LaadScherm.jsx, los van vh/dvh, statusbalk of scrollstand. Anders
         sprong het logo een stukje als de app het scherm overnam. */
      .loading-container {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
      }
      
      /* Zelfde als LaadScherm.jsx: dunne boog met staart om het logo, en een
         lichtstreep over het logo. Beide lopen op de klok (script onder #root), zodat
         opnieuw neerzetten verdergaat waar het was. Alleen transform beweegt:
         dat loopt door terwijl de app-code nog wordt ingelezen. */
      .loading-logo {
        position: relative;
        width: 150px;
        height: 150px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .loading-spinner {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(from 0deg, rgba(255,255,255,0) 0deg, rgba(255,255,255,0) 150deg, #fff 360deg);
        -webkit-mask-image: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
        mask-image: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
        animation: spin 1.6s linear infinite;
        will-change: transform;
      }
      .loading-glans {
        position: relative;
        width: 104px;
        height: 52px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.5);
        -webkit-mask: url(/ma-logo-header.png) center / contain no-repeat;
        mask: url(/ma-logo-header.png) center / contain no-repeat;
      }
      .loading-glans i {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 45%;
        background: linear-gradient(105deg, rgba(255,255,255,0), #fff, rgba(255,255,255,0));
        animation: glans 2.4s linear infinite;
        will-change: transform;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes glans {
        from { transform: translateX(-120%); }
        to { transform: translateX(340%); }
      }
    </style>
  </head>
  <body>
    <!-- Meta Pixel (noscript) — hoort in body, niet in head -->
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1651499006027796&ev=PageView&noscript=1"
    /></noscript>
    <div id="root">
      <div class="loading-container">
        <div class="loading-logo">
          <div class="loading-spinner"></div>
          <div class="loading-glans"><i></i></div>
        </div>
      </div>
    </div>
    <!-- Laadanimatie vastzetten op de klok, zelfde som als LaadScherm.jsx. Via
         startTime en niet via een vertraging: een vertraging telt vanaf het
         eerste tekenen, en dat schuift op als de app-code de pagina bezet houdt. -->
    <script>
      (function () {
        try {
          var start = -(performance.timeOrigin % 4800)
          document.querySelectorAll('.loading-spinner, .loading-glans i').forEach(function (el) {
            el.getAnimations().forEach(function (a) { a.startTime = start })
          })
        } catch (e) {}
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>

<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Video</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
<!--
  Speler-pagina voor de native app (iOS/Android, Capacitor).

  Waarom dit bestaat: in de app draait de webview op capacitor://localhost.
  Voor dat schema stuurt WKWebView geen Referer-header mee, en YouTube weigert
  sinds 2025 elke embed zonder geldige https-referer met "foutcode 153".
  Deze pagina staat op www.myarcfitness.com, dús de YouTube-iframe hierbinnen
  krijgt wél een https-referer en speelt gewoon af.

  Gebruik:  /yt.html?v=<videoId>&autoplay=1&mute=0&...   (alle YouTube-embed-
  parameters worden doorgegeven). De speler meldt zijn status aan de app via
  postMessage: { source: 'myarc-yt', videoId, state }  (state 0 = afgelopen).
-->
<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var videoId = (qs.get('v') || '').replace(/[^\w-]/g, '');
  if (!videoId) { document.body.innerHTML = ''; return; }
  qs.delete('v');
  // Vaste instellingen: in de app willen we altijd inline (niet de systeemspeler)
  // en de jsapi aan, zodat we "afgelopen" kunnen doorgeven.
  qs.set('playsinline', '1');
  qs.set('enablejsapi', '1');
  qs.set('origin', location.origin);

  var iframe = document.createElement('iframe');
  iframe.id = 'player';
  iframe.src = 'https://www.youtube-nocookie.com/embed/' + videoId + '?' + qs.toString();
  iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen';
  iframe.allowFullscreen = true;
  iframe.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
  document.body.appendChild(iframe);

  function post(state) {
    try { parent.postMessage({ source: 'myarc-yt', videoId: videoId, state: state }, '*'); } catch (e) {}
  }

  window.onYouTubeIframeAPIReady = function () {
    try {
      new YT.Player('player', { events: { onStateChange: function (e) { post(e && e.data); } } });
    } catch (e) {}
  };
  var tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
})();
</script>
</body>
</html>
